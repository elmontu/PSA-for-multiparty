name: build-and-unit-tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gdb libssl-dev \
            gcc-11 g++-11 \
            python3 python3-pip python3-setuptools \
            wget curl libboost-all-dev libtool \
            pkg-config libsodium-dev \
            git
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

      - name: Install CMake 4.0.0
        run: |
          wget -q https://cmake.org/files/v4.0/cmake-4.0.0-linux-x86_64.tar.gz
          sudo tar -xzf cmake-4.0.0-linux-x86_64.tar.gz --strip-components=1 -C /usr/local
          cmake --version

      - name: Build with unit tests enabled
        run: |
          python3 build.py -DVOLE_PSI_ENABLE_BOOST=ON -DVOLE_PSI_BUILD_TESTS=ON

      - name: Run offline unit tests
        run: |
          # tests are opt-in via -DVOLE_PSI_BUILD_TESTS=ON; the exact output
          # path follows the preset's build dir. Run the WHOLE unit-test suite,
          # not just two binaries — a test that stops being built or starts
          # failing should turn CI red. Exit code 77 == "skipped" (e.g. tests
          # that need an in-process socket API not wired in this environment).
          fail=0
          shopt -s nullglob
          for t in out/build/linux/tests/unit/test_*; do
              [ -x "$t" ] || continue
              echo "=== running $t ==="
              if "$t"; then
                  :
              else
                  rc=$?
                  if [ "$rc" -eq 77 ]; then
                      echo "--- SKIPPED (exit 77): $t"
                  else
                      echo "!!! FAILED (exit $rc): $t"
                      fail=1
                  fi
              fi
          done
          exit $fail

      - name: Print disk usage (debug)
        if: always()
        run: df -h
